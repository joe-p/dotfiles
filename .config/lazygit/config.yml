os:
  edit: 'nvr --remote-wait {{filename}}'
  openLink: sh -c 'printf "\033]52;c;$(printf "%s" "{{link}}" | base64 | tr -d "\n")\a" > /dev/tty'
  copyToClipboardCmd: sh -c 'printf "\033]52;c;$(printf "%s" "{{text}}" | base64 | tr -d "\n")\a" > /dev/tty'
promptToReturnFromSubprocess: false
quitOnTopLevelReturn: true
notARepository: quit
git:
  overrideGpg: true
  diffRenderers:
    - command: "difft --color=always"
      type: extDiff
